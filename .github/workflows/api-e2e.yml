name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: corepack pnpm --filter @agentwaypoint/api prisma:generate

      - name: Typecheck API
        run: corepack pnpm --filter @agentwaypoint/api typecheck

      - name: Typecheck Web
        run: corepack pnpm --filter @agentwaypoint/web typecheck

      - name: Run API E2E
        env:
          CI: "true"
        run: ./scripts/test-api-e2e.sh
